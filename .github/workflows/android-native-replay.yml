name: Android candidate validation
'on':
  push:
    branches:
    - verify/android-native-1-1-1
permissions:
  contents: read
  actions: read
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Ensure APK application sources exactly match the tested checkout
      run: git diff --exit-code 3898134e390c3054c44dd0dca59888c9eb233708 HEAD -- . ':(exclude)scripts/android-smoke.py' ':(exclude).github/workflows/android-native-replay.yml'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Wait for the candidate APK to finish building
      uses: actions/github-script@v7
      with:
        script: "for (let attempt=0; attempt<20; attempt++) {\n  const result = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:36950585573});\n\
          \  if (result.data.artifacts.some(a => a.name === 'workout-timer-update-existing-debug' && !a.expired)) return;\n\
          \  const run = await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:36950585573});\n\
          \  if (run.data.status === 'completed') throw new Error('Candidate build finished without its APK');\n  core.info('Candidate\
          \ is compiling; waiting for its verified artifact.');\n  await new Promise(resolve => setTimeout(resolve,45000));\n\
          }\nthrow new Error('Candidate artifact did not arrive in time');"
    - uses: actions/download-artifact@v4
      with:
        name: workout-timer-update-existing-debug
        path: apk/update
        run-id: 36950585573
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Find previous debug-compatible APK for upgrade regression
      uses: actions/github-script@v7
      with:
        script: "const fs = require('fs');\nconst artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,\
          \ {\n  owner: context.repo.owner, repo: context.repo.repo, per_page: 100\n});\nconst baseline = artifacts.find(a\
          \ => !a.expired &&\n  a.workflow_run?.head_branch === 'main' &&\n  a.workflow_run?.id !== context.runId &&\n  ['workout-timer-debug',\
          \ 'workout-timer-update-existing-debug'].includes(a.name));\nif (baseline) {\n  const zip = await github.rest.actions.downloadArtifact({\n\
          \    owner: context.repo.owner, repo: context.repo.repo,\n    artifact_id: baseline.id, archive_format: 'zip'\n\
          \  });\n  fs.writeFileSync('baseline.zip', Buffer.from(zip.data));\n  core.info(`Upgrade baseline: ${baseline.name}\
          \ from run ${baseline.workflow_run.id}`);\n} else {\n  core.warning('No previous compatible APK is available; only\
          \ fresh install will be checked.');\n}\n"
    - name: Prepare emulator checks
      run: 'python3 -m pip install Pillow uiautomator2==3.7.0

        if [ -f baseline.zip ]; then unzip baseline.zip -d apk/baseline; fi

        echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Test installation, upgrade, recovery, and offline pictures
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_2
        disable-animations: true
        script: bash scripts/run-android-smoke.sh
    - name: Upload native screenshots and diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-native-evidence
        path: native-evidence
        if-no-files-found: warn
    - name: Prepare the exact tested APK for download
      run: 'mkdir -p verified

        cp apk/update/app-release.apk verified/WorkoutTimer-1.1.1-update.apk

        sha256sum verified/WorkoutTimer-1.1.1-update.apk'
    - name: Publish tested update APK
      uses: actions/upload-artifact@v4
      with:
        name: WorkoutTimer-1.1.1-verified-update
        path: verified/WorkoutTimer-1.1.1-update.apk
        if-no-files-found: error
    timeout-minutes: 20
