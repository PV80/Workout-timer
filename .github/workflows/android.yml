name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  debug:
    # Release-mode update for existing debug-signed installations. The Expo
    # template uses its stable debug key for release until we override it below.
    # Keep this certificate: replacing it would prevent data-preserving updates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Check workout recovery
        run: npm test && npm run typecheck

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build compatible release-mode APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify compatible APK and embedded artwork
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk --debug-certificate android/app/debug.keystore

      - name: Upload compatible update APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-timer-update-existing-debug
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    # Signed release APK. Only runs on main, and only if keystore secrets exist.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Decode keystore
        run: |
          # Strip whitespace/newlines first so a base64 secret created with
          # line-wrapping (e.g. `base64 -i` on macOS) still decodes to a valid
          # keystore instead of "Tag number over 30 is not supported".
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > android/app/workout-timer.keystore
          # Fail early with a clear message if the result isn't a valid keystore.
          keytool -list -keystore android/app/workout-timer.keystore \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" >/dev/null \
            || { echo "::error::Decoded keystore is invalid. Re-create ANDROID_KEYSTORE_BASE64 with: base64 -w0 workout-timer.keystore (no line wrapping)."; exit 1; }

      - name: Wire signing config into build.gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          src = p.read_text()
          signing_block = """
              signingConfigs {
                  release {
                      def kp = new Properties()
                      def kf = rootProject.file('key.properties')
                      if (kf.exists()) { kf.withReader('UTF-8') { kp.load(it) } }
                      storeFile file(kp['storeFile'] ?: 'workout-timer.keystore')
                      storePassword kp['storePassword']
                      keyAlias kp['keyAlias']
                      keyPassword kp['keyPassword']
                  }
              }
          """
          if 'signingConfigs {' not in src or 'release {' not in src.split('signingConfigs {',1)[1].split('}',1)[0]:
              src = src.replace('android {', 'android {\n' + signing_block, 1)
          src = src.replace(
              'signingConfig signingConfigs.debug',
              'signingConfig signingConfigs.release',
          )
          p.write_text(src)
          print('build.gradle patched')
          PY

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=workout-timer.keystore
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed APK and embedded artwork
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-timer-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  native-smoke:
    needs: [debug, release]
    if: always() && needs.debug.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: workout-timer-update-existing-debug
          path: apk/update
      - uses: actions/download-artifact@v4
        if: needs.release.result == 'success'
        with:
          name: workout-timer-release
          path: apk/release
      - name: Find previous debug-compatible APK for upgrade regression
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const baseline = artifacts.find(a => !a.expired &&
              a.workflow_run?.head_branch === 'main' &&
              a.workflow_run?.id !== context.runId &&
              ['workout-timer-debug', 'workout-timer-update-existing-debug'].includes(a.name));
            if (baseline) {
              const zip = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: baseline.id, archive_format: 'zip'
              });
              fs.writeFileSync('baseline.zip', Buffer.from(zip.data));
              core.info(`Upgrade baseline: ${baseline.name} from run ${baseline.workflow_run.id}`);
            } else {
              core.warning('No previous compatible APK is available; only fresh install will be checked.');
            }
      - name: Prepare emulator checks
        run: |
          python3 -m pip install Pillow uiautomator2==3.7.0
          if [ -f baseline.zip ]; then unzip baseline.zip -d apk/baseline; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installation, upgrade, recovery, and offline pictures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-android-smoke.sh
      - name: Upload native screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-evidence
          path: native-evidence
          if-no-files-found: warn
